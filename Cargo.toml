[package]
name = "arb-bot"
version = "0.1.0"
edition = "2021"
description = "Read-only multi-chain DEX arbitrage scanner with SQLite logging and Python analytics"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ianfigueroa/Arb-Scanner"
homepage = "https://github.com/ianfigueroa/Arb-Scanner"
keywords = ["arbitrage", "ethereum", "defi", "scanner", "mev"]
categories = ["command-line-utilities", "finance"]

[dependencies]
ethers = { version = "2", features = ["ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
