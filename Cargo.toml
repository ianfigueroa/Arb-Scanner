[package]
name = "arb-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "2", features = ["ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
serde_json = "1"
